<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        /* Basic reset and body styles */
        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
        }

        /* Hero section styles */
        .hero {
            /* Use the banner image as the background */
            background-image: url('assets/ROBanner.webp');

            /* Make the hero section cover the full viewport height */
            height: 100vh;

            /* Center the background image */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

            /* Flexbox for centering content */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            /* Add a subtle shadow to make the text more readable */
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .buttons {
            margin-top: 2rem;
        }

        .buttons a {
            text-decoration: none;
            margin: 0 1rem;
        }

        .buttons img {
            height: 60px; /* Adjust height as needed */
            transition: transform 0.3s ease-in-out;
        }

        .buttons img:hover {
            /* Add a slight zoom effect on hover */
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <h1>Product Title</h1>
            <div class="buttons">
                <a href="#buy" title="Buy Now">
                    <img src="Assets/buy-now.png" alt="Buy Now button">
                </a>
                <a href="#trailer" title="Watch Trailer">
                    <img src="Assets/watch-trailer.png" alt="Watch Trailer button">
                </a>
            </div>
        </section>
    </main>
</body>
</html>
